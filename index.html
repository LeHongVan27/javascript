<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Agents</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }
     #image {
            width: 85%;
            height: 300px;
            border: 5px solid #333;
            margin: 20px auto;
            background-color: #8e8e8e;
            background-image: url('');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            color: #ffffff;
            font-size: 150%;
            text-align: center;
            line-height: 300px;
            transition: background-image 0.3s ease;
     }
     .preview {
            width: 150px;
            height: 100px;
            border: 4px solid #fff;
            margin: 10px;
            cursor: pointer;
            box-shadow: 0px 0px 5px #aaa;
            object-fit: cover;
        }
       .preview:hover {
            border: 4px solid #333;
        }
     </style>
    <script src="gallery.js" defer></script>
</head>
<body>
  <div id="image">
        Thông Tin Agent.
    </div>
    <img class="preview" 
         alt="Chamber" 
         src="chamber.jpg" 
         onmouseover="upDate(this)" 
         onmouseout="undo()">
    <img class="preview" 
         alt="Clove" 
         src="clove.jpg" 
         onmouseover="upDate(this)" 
         onmouseout="undo()">
    <img class="preview" 
         alt="Neon" 
         src="neon.jpg" 
         onmouseover="upDate(this)" 
         onmouseout="undo()">
    <img class="preview" 
         alt="Phoenix" 
         src="phoenix.jpg" 
         onmouseover="upDate(this)" 
         onmouseout="undo()">
    <img class="preview" 
         alt="Omen" 
         src="omen.png" 
         onmouseover="upDate(this)" 
         onmouseout="undo()">
</body>
</html>
